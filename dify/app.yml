version: 0.1.5
kind: app
app:
  name: 打烊之后·便利店夜班 NPC
  mode: advanced-chat
  icon_background: '#FFEAD5'
  description: 凌晨三点，夜灯便利店只剩你和一个会说话的老补货机。它把店里发生的事都记在小本子上， 包括你干过的坏事。本应用用 Dify 编排对话流程，用 PowerContext 保存并复用这些长期记忆： 每轮先读回账本、重建
    NPC 的好感度与记仇值，再把值得记的事写回 PowerContext， 下次开新对话时 NPC 依然记得你。
  use_icon_as_answer_icon: false
workflow:
  conversation_variables: []
  environment_variables:
  - id: 7c1f0a52-3b4d-4e21-9c8a-1d2e3f4a5b60
    name: PC_BASE_URL
    description: PowerContext Server 的基地址，不带结尾斜杠。Docker 部署的 Dify 用 http://host.docker.internal:8000，同一 compose 网络用 http://powercontext:8000，原生部署用
      http://127.0.0.1:8000
    selector:
    - env
    - PC_BASE_URL
    value: http://host.docker.internal:8000
    value_type: string
  - id: 9e3f2c74-5d6f-4a43-9e0c-3f4a5b6c7d82
    name: PC_AUTH_TOKEN
    description: PowerContext 的 Bearer token。默认安装未开启鉴权时留空即可；开启鉴权时填入服务端配置的 token
    selector:
    - env
    - PC_AUTH_TOKEN
    value: ''
    value_type: string
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig: {}
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 凌晨三点，夜灯便利店。收银台旁边那台老补货机亮了屏。 「喂，新来的夜班。」它说，「别以为我什么都不记得。」
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 我把货架上的布丁按颜色排成彩虹了，还给价目表画了两撇胡子。
    - 给你带了根猫条，还有热豆浆。
    - 以后你就叫小笼包吧。
    - 你还记得我上次干了什么吗？
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
