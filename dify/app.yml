    nodes:
    - data:
        desc: 玩家在聊天框里说的那一句话
        selected: false
        title: 开始
        type: start
        variables: []
      height: 90
      id: start
      position:
        x: 30
        y: 420
      positionAbsolute:
        x: 30
        y: 420
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json


          def main(user_id: str, conversation_id: str) -> dict:
              uid = (user_id or "").strip() or "anonymous"
              conv = (conversation_id or "").strip() or uid
              body = json.dumps(
                  {
                      "title": "夜灯便利店·夜班存档·%s" % uid[:60],
                      "summary": "Dify 应用《打烊之后·便利店夜班 NPC》的长期记忆存档：NPC 的小本子、玩家偏好与剧情进展都保存在这个 Scope 的 Memory 里。",
                      "idempotency_key": "dify-nightstore-%s" % uid[:80],
                  },
                  ensure_ascii=False,
              )
              return {"create_body": body, "user_id": uid, "conversation_id": conv}
        code_language: python3
        desc: 用 Dify 的 user_id 生成玩家存档键：同一个人跨会话共用一份记忆，不同玩家互相隔离；请求体交给 json.dumps，避免拼接注入
        outputs:
          create_body:
            children: null
            type: string
          user_id:
            children: null
            type: string
          conversation_id:
            children: null
            type: string
        selected: false
        title: 准备玩家存档
        type: code
        variables:
        - value_selector:
          - sys
          - user_id
          variable: user_id
        - value_selector:
          - sys
          - conversation_id
          variable: conversation_id
      height: 120
      id: code_prepare
      position:
        x: 330
        y: 420
      positionAbsolute:
        x: 330
        y: 420
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: scope-body
            key: ''
            type: text
            value: '{{#code_prepare.create_body#}}'
          type: json
        desc: POST /v1/scopes —— 按玩家创建（或幂等复用）PowerContext 存档，一个玩家一份记忆
        headers: |-
          Content-Type:application/json
          Authorization: Bearer {{#env.PC_AUTH_TOKEN#}}
        method: post
        params: ''
        selected: false
        title: 取出玩家存档
        type: http-request
        url: '{{#env.PC_BASE_URL#}}/v1/scopes'
      height: 218
      id: http_scope
      position:
        x: 630
        y: 420
      positionAbsolute:
        x: 630
        y: 420
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json


          def main(scope_json: str, user_id: str, conversation_id: str) -> dict:
              scope_id = ""
              try:
                  data = json.loads(scope_json or "{}")
                  if isinstance(data, dict):
                      scope_id = (data.get("scope_id") or "").strip()
              except Exception:
                  scope_id = ""
              list_body = json.dumps({"scope_id": scope_id}, ensure_ascii=False)
              note = "user=%s; conversation=%s; scope=%s" % (
                  (user_id or "").strip() or "anonymous",
                  (conversation_id or "").strip() or "-",
                  scope_id or "missing",
              )
              return {"scope_id": scope_id, "list_body": list_body, "mapping_note": note}
        code_language: python3
        desc: 从 Scope 响应里取 scope_id，并用 json.dumps 生成读账本请求体（scope_id 绝不直接拼进 JSON）
        outputs:
          scope_id:
            children: null
            type: string
          list_body:
            children: null
            type: string
          mapping_note:
            children: null
            type: string
        selected: false
        title: 解析存档·生成请求体
        type: code
        variables:
        - value_selector:
          - http_scope
          - body
          variable: scope_json
        - value_selector:
          - code_prepare
          - user_id
          variable: user_id
        - value_selector:
          - code_prepare
          - conversation_id
          variable: conversation_id
      height: 120
      id: code_scope
      position:
        x: 930
        y: 420
      positionAbsolute:
        x: 930
        y: 420
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: ledger-body
            key: ''
            type: text
            value: '{{#code_scope.list_body#}}'
          type: json
        desc: POST /v1/memory/entries/list —— 把这个存档下的全部活跃记忆条目读回来，这就是 NPC 的"小本子"
        headers: |-
          Content-Type:application/json
          Authorization: Bearer {{#env.PC_AUTH_TOKEN#}}
        method: post
        params: ''
        selected: false
        title: 翻出小本子
        type: http-request
        url: '{{#env.PC_BASE_URL#}}/v1/memory/entries/list'
      height: 218
      id: http_ledger
      position:
        x: 1230
        y: 420
      positionAbsolute:
        x: 1230
        y: 420
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |-
          import json
          import re

          PRANK_WORDS = [
              "恶作剧", "恶搞", "整蛊", "捉弄", "捣乱", "搞事", "搞破坏", "开玩笑",
              "彩虹", "排成", "按颜色", "橡皮筋", "弹珠", "便利贴", "画胡子",
              "偷吃", "顺走", "拿走", "藏起来", "骗",
          ]

          GIFT_WORDS = [
              "猫条", "小鱼干", "零食", "礼物", "奶茶", "咖啡", "饮料", "豆浆",
              "鲜花", "小花花", "擦玻璃", "夸奖", "喜欢你", "谢谢", "关心",
              "照顾", "好吃", "请你喝", "带给你", "带了", "抱抱", "摸摸",
          ]

          RECALL_WORDS = [
              "记得", "记不记得", "还记得", "上次", "以前", "过去", "账本", "小本子",
              "干过什么", "做过什么", "我干过", "记仇", "你叫", "叫什么",
              "翻翻", "念念", "旧账", "记着",
          ]

          RENAME_WORDS = ["改名", "换个名字", "换名字", "你的名字", "取个名", "起个名"]

          RENAME_PATTERN = re.compile(
              r"(?:以后|今后|从今天起|从现在起)?\s*(?:你)?\s*(?:就)?\s*叫\s*"
              r"([^\s,，。.!?！？、\"'“”]{1,12})"
          )

          TRAILING_PARTICLE = re.compile(r"[吧啦呀啊呢哦嘛喔咯]+$")

          EVENT_PREFIX = "type="

          def sanitize(text):
              # 去掉会破坏条目格式的半角分号和等号，并截断长度
              cleaned = (text or "").replace(";", "；").replace("=", "＝")
              cleaned = cleaned.replace("\r", " ").replace("\n", " ").strip()
              return cleaned[:160]

          def parse_event(text):
              data = {}
              for part in (text or "").split(";"):
                  if "=" in part:
                      key, value = part.split("=", 1)
                      data[key.strip()] = value.strip()
              return data

          def to_int(raw):
              try:
                  return int(str(raw).strip())
              except (TypeError, ValueError):
                  return 0

          def main(player_input: str, ledger_json: str, scope_id: str, conversation_id: str) -> dict:
              say = (player_input or "").strip()

              # 1) 读取 PowerContext 返回的记忆账本
              entries = []
              try:
                  payload = json.loads(ledger_json) if ledger_json else {}
                  if isinstance(payload, dict):
                      raw_entries = payload.get("entries") or []
                      if isinstance(raw_entries, list):
                          entries = raw_entries
              except Exception:
                  entries = []

              # 2) 从账本重建 NPC 状态（状态不存变量里，而是从长期记忆里现算）
              npc_name = "团子"
              warmth = 0
              grudge = 0
              events = []
              for entry in entries:
                  if not isinstance(entry, dict):
                      continue
                  if entry.get("state") not in (None, "active"):
                      continue
                  kind = (entry.get("kind") or "").strip()
                  text = (entry.get("text") or "").strip()
                  if kind == "npc-name":
                      match = re.search(r"name=(.+)$", text)
                      if match:
                          npc_name = match.group(1).strip() or npc_name
                  elif kind == "npc-event":
                      data = parse_event(text)
                      warmth += to_int(data.get("warmth"))
                      grudge += to_int(data.get("grudge"))
                      events.append(data)

              # 3) 判定本轮意图（纯规则，行为可预期）
              intent = "smalltalk"
              new_name = ""
              match = RENAME_PATTERN.search(say)
              if match:
                  new_name = TRAILING_PARTICLE.sub("", match.group(1).strip())

              if any(word in say for word in RECALL_WORDS):
                  intent = "recall"
              elif new_name or any(word in say for word in RENAME_WORDS):
                  intent = "rename"
                  if not new_name:
                      new_name = "小笼包"
              elif any(word in say for word in PRANK_WORDS):
                  intent = "prank"
              elif any(word in say for word in GIFT_WORDS):
                  intent = "gift"

              # 4) 计算状态增量，以及这轮要不要写进小本子
              warmth_delta = 0
              grudge_delta = 0
              write_kind = ""
              write_text = ""

              if intent == "prank":
                  warmth_delta = -1
                  grudge_delta = 2
              elif intent == "gift":
                  warmth_delta = 2
                  grudge_delta = 0

              if intent in ("prank", "gift"):
                  write_kind = "npc-event"
                  write_text = "%s%s; warmth=%d; grudge=%d; say=%s" % (
                      EVENT_PREFIX, intent, warmth_delta, grudge_delta, sanitize(say),
                  )
              elif intent == "rename":
                  write_kind = "npc-name"
                  new_name = sanitize(new_name)
                  write_text = "name=%s" % new_name
                  npc_name = new_name or npc_name

              # 5) 组装写回 PowerContext 的请求体（用 json.dumps 保证用户输入里的引号不会破坏 JSON）
              remember_payload = ""
              if write_kind and write_text:
                  remember_payload = json.dumps({
                      "scope_id": (scope_id or "").strip(),
                      "kind": write_kind,
                      "text": write_text,
                      "reason": "Dify 夜班便利店 NPC：把本轮互动写进长期记忆（会话 %s）" % (conversation_id or "-")[:80],
                  }, ensure_ascii=False)

              # 6) 组装给 LLM 的账本摘要与状态摘要
              recent = events[-50:]
              if recent:
                  lines = []
                  for index, item in enumerate(recent, 1):
                      lines.append("%d. [%s] %s" % (index, item.get("type", "?"), item.get("say", "")))
                  ledger_digest = "\n".join(lines)
              else:
                  ledger_digest = "（小本子还是空的，你还没记过任何事）"

              if grudge >= 3 and warmth <= 0:
                  tone = "记仇"
              elif warmth >= 3:
                  tone = "亲近"
              else:
                  tone = "日常"

              next_warmth = warmth + warmth_delta
              next_grudge = grudge + grudge_delta
              event_count = len(events) + (1 if write_kind == "npc-event" else 0)

              state_digest = (
                  "NPC 名字：%s｜好感度：%d｜记仇值：%d｜本轮意图：%s｜语气档位：%s"
                  % (npc_name, warmth, grudge, intent, tone)
              )
              status_line = (
                  "【小本子】好感 %d｜记仇 %d｜已记 %d 件事｜NPC：%s"
                  % (next_warmth, next_grudge, event_count, npc_name)
              )

              return {
                  "intent": intent,
                  "npc_name": npc_name,
                  "warmth": str(next_warmth),
                  "grudge": str(next_grudge),
                  "event_count": str(event_count),
                  "ledger_digest": ledger_digest,
                  "state_digest": state_digest,
                  "status_line": status_line,
                  "remember_payload": remember_payload,
              }
        code_language: python3
        desc: 解析账本重建 NPC 状态、判定本轮意图，并生成写回 PowerContext 的 JSON 请求体
        outputs:
          event_count:
            children: null
            type: string
          grudge:
            children: null
            type: string
          intent:
            children: null
            type: string
          ledger_digest:
            children: null
            type: string
          npc_name:
            children: null
            type: string
          remember_payload:
            children: null
            type: string
          state_digest:
            children: null
            type: string
          status_line:
            children: null
            type: string
          warmth:
            children: null
            type: string
        selected: false
        title: 解析账本·判定意图
        type: code
        variables:
        - value_selector:
          - sys
          - query
          variable: player_input
        - value_selector:
          - http_ledger
          - body
          variable: ledger_json
        - value_selector:
          - code_scope
          - scope_id
          variable: scope_id
        - value_selector:
          - code_prepare
          - conversation_id
          variable: conversation_id
      height: 120
      id: code_ledger
      position:
        x: 1530
        y: 420
      positionAbsolute:
        x: 1530
        y: 420
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: not empty
            id: cond-write-payload
            value: ''
            varType: string
            variable_selector:
            - code_ledger
            - remember_payload
          id: case-write
          logical_operator: and
        desc: 这一轮是否产生了值得长期记住的事（恶作剧 / 示好 / 改名）
        logical_operator: and
        selected: false
        title: 这轮要记账吗
        type: if-else
      height: 198
      id: if_write
      position:
        x: 1830
        y: 420
      positionAbsolute:
        x: 1830
        y: 420
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: remember-body
            key: ''
            type: text
            value: '{{#code_ledger.remember_payload#}}'
          type: json
        desc: POST /v1/memory/remember —— 把这轮互动写进 PowerContext 的长期记忆
        headers: |-
          Content-Type:application/json
          Authorization: Bearer {{#env.PC_AUTH_TOKEN#}}
        method: post
        params: ''
        selected: false
        title: 记进小本子
        type: http-request
        url: '{{#env.PC_BASE_URL#}}/v1/memory/remember'
      height: 218
      id: http_remember
      position:
        x: 2130
        y: 250
      positionAbsolute:
        x: 2130
        y: 250
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: is
            id: cond-intent-recall
            value: recall
            varType: string
            variable_selector:
            - code_ledger
            - intent
          id: case-intent
          logical_operator: and
        desc: 按本轮意图分流：翻账本 / 日常闲聊
        logical_operator: and
        selected: false
        title: 翻账本还是闲聊
        type: if-else
      height: 198
      id: if_route
      position:
        x: 2130
        y: 520
      positionAbsolute:
        x: 2130
        y: 520
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
