    - data:
        code: |
          import re

          OPTION_LINE = re.compile(r"^\s*(?:/|／)\s*\S{1,20}\s*$")
          HEADER = re.compile(r"^\s*(?:下一步|你可以|行动选项|选项)[^\n]{0,14}[:：]?\s*$")
          TRAILING_OPTIONS = re.compile(r"(?:\s*(?:/|／)\s*[^/／]{1,20}){2,}\s*$")

          FALLBACK_OPTIONS = {
              "prank": ["把货架重新摆整齐", "请你喝一杯热豆浆赔罪", "再编一个更离谱的恶作剧"],
              "gift": ["再给你带根猫条", "陪你值完这一班", "问问你还记恨我什么"],
              "rename": ["还是叫你团子吧", "给我讲讲你为什么爱记仇", "试着叫一声新名字"],
              "recall": ["再说说另一件旧事", "我请你喝豆浆", "问问小本子还记了什么"],
              "smalltalk": ["聊聊今晚的客人", "给你带点夜宵", "问问店里的怪事"],
          }

          FALLBACK_LINE = {
              "prank": "行啊你，连布丁都不放过。这事儿我给你记小本子上了，别以为我转头就忘。",
              "gift": "哟，还知道带东西来。猫条我收下了，不过别指望我这么快就忘了你上次干的好事。",
              "rename": "新名字我收下了，不过你最好别是随口一说。我这台老机器，记名字记得可牢。",
              "recall": "你要真想知道，就把小本子翻开自己看——反正上面写的，都是你自己干的好事。",
              "smalltalk": "凌晨三点的店，就剩你和我大眼瞪小眼。说吧，今晚想干点什么。",
          }


          def clean_body(text, npc_name):
              speakers = ["你"] + ([npc_name] if npc_name else [])
              speaker_re = re.compile(r"^\s*(?:%s)\s*[：:]\s*" % "|".join(re.escape(item) for item in speakers))
              lines = (text or "").replace("\r", "").split("\n")
              header_at = None
              for index, line in enumerate(lines):
                  if HEADER.match(line.strip()):
                      header_at = index
              body_lines = lines[:header_at] if header_at is not None else lines
              cleaned = []
              for raw in body_lines:
                  line = TRAILING_OPTIONS.sub("", raw.rstrip())
                  stripped = line.strip()
                  if not stripped:
                      cleaned.append("")
                      continue
                  if OPTION_LINE.match(stripped):
                      continue
                  line = re.sub(r"^\s*(?:/|／)\s+", "", line)
                  line = speaker_re.sub("", line)
                  cleaned.append(line.rstrip())
              out = "\n".join(cleaned)
              out = re.sub(r"\n{3,}", "\n\n", out).strip()
              return out


          def pick_options(text):
              options = []
              for raw in (text or "").replace("\r", "").split("\n"):
                  line = raw.strip()
                  match = re.match(r"^(?:/|／)\s*(.+)$", line)
                  if not match:
                      continue
                  item = match.group(1).strip().strip("。.!！?？ ")
                  if not item or "选项" in item or not (2 <= len(item) <= 20):
                      continue
                  if item not in options:
                      options.append(item)
              return options[:3]


          def main(llm_text: str, intent: str, npc_name: str) -> dict:
              body = clean_body(llm_text, npc_name)
              key = intent if intent in FALLBACK_OPTIONS else "smalltalk"
              if len(body) < 10:
                  body = FALLBACK_LINE[key]
              options = pick_options(llm_text)
              if len(options) < 2:
                  options = FALLBACK_OPTIONS[key][:3]
              text = "%s\n\n下一步你可以：\n%s" % (body, "\n".join("/ " + item for item in options))
              return {"text": text, "options": " / ".join(options)}
        code_language: python3
        desc: 兜底整理回复格式：清掉模型写出的占位选项，保证末尾一定有 2~3 个具体可选的下一步
        outputs:
          text:
            children: null
            type: string
          options:
            children: null
            type: string
        selected: false
        title: 整理回复·翻账本
        type: code
        variables:
        - value_selector:
          - llm_recall
          - text
          variable: llm_text
        - value_selector:
          - code_ledger
          - intent
          variable: intent
        - value_selector:
          - code_ledger
          - npc_name
          variable: npc_name
      height: 120
      id: code_reply_recall
      position:
        x: 2730
        y: 430
      positionAbsolute:
        x: 2730
        y: 430
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
