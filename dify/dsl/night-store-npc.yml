version: 0.1.5
kind: app
app:
  name: 打烊之后·便利店夜班 NPC
  mode: advanced-chat
  icon_background: '#FFEAD5'
  description: >-
    凌晨三点，夜灯便利店只剩你和一个会说话的老补货机。它把店里发生的事都记在小本子上，
    包括你干过的坏事。本应用用 Dify 编排对话流程，用 PowerContext 保存并复用这些长期记忆：
    每轮先读回账本、重建 NPC 的好感度与记仇值，再把值得记的事写回 PowerContext，
    下次开新对话时 NPC 依然记得你。
  use_icon_as_answer_icon: false
workflow:
  conversation_variables: []
  environment_variables:
  - id: 7c1f0a52-3b4d-4e21-9c8a-1d2e3f4a5b60
    name: PC_BASE_URL
    description: PowerContext Server 的基地址，不带结尾斜杠。Docker 部署的 Dify 用 http://host.docker.internal:8000，同一 compose 网络用 http://powercontext:8000，原生部署用 http://127.0.0.1:8000
    selector:
    - env
    - PC_BASE_URL
    value: http://host.docker.internal:8000
    value_type: string
  - id: 8d2e1b63-4c5e-4f32-8d9b-2e3f4a5b6c71
    name: PC_SCOPE_ID
    description: PowerContext 的 scope_id，由 scripts/init_scope.py 创建后回填；一个 scope 就是一份独立存档
    selector:
    - env
    - PC_SCOPE_ID
    value: ''
    value_type: string
  - id: 9e3f2c74-5d6f-4a43-9e0c-3f4a5b6c7d82
    name: PC_AUTH_TOKEN
    description: PowerContext 的 Bearer token。默认安装未开启鉴权时留空即可；开启鉴权时填入服务端配置的 token
    selector:
    - env
    - PC_AUTH_TOKEN
    value: ''
    value_type: string
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig: {}
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: >-
      凌晨三点，夜灯便利店。收银台旁边那台老补货机亮了屏。
      「喂，新来的夜班。」它说，「别以为我什么都不记得。」
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 我把货架上的布丁按颜色排成彩虹了，还给价目表画了两撇胡子。
    - 给你带了根猫条，还有热豆浆。
    - 以后你就叫小笼包吧。
    - 你还记得我上次干了什么吗？
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: http-request
      id: start-source-http_ledger-target
      source: start
      sourceHandle: source
      target: http_ledger
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: code
      id: http_ledger-source-code_ledger-target
      source: http_ledger
      sourceHandle: source
      target: code_ledger
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: if-else
      id: code_ledger-source-if_write-target
      source: code_ledger
      sourceHandle: source
      target: if_write
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: http-request
      id: if_write-true-http_remember-target
      source: if_write
      sourceHandle: 'true'
      target: http_remember
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: if-else
      id: if_write-false-if_route-target
      source: if_write
      sourceHandle: 'false'
      target: if_route
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: if-else
      id: http_remember-source-if_route-target
      source: http_remember
      sourceHandle: source
      target: if_route
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: llm
      id: if_route-true-llm_recall-target
      source: if_route
      sourceHandle: 'true'
      target: llm_recall
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: llm
      id: if_route-false-llm_chat-target
      source: if_route
      sourceHandle: 'false'
      target: llm_chat
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: answer
      id: llm_recall-source-answer_recall-target
      source: llm_recall
      sourceHandle: source
      target: answer_recall
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: answer
      id: llm_chat-source-answer_chat-target
      source: llm_chat
      sourceHandle: source
      target: answer_chat
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 玩家在聊天框里说的那一句话
        selected: false
        title: 开始
        type: start
        variables: []
      height: 90
      id: start
      position:
        x: 30
        y: 420
      positionAbsolute:
        x: 30
        y: 420
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: ledger-body
            key: ''
            type: text
            value: '{"scope_id": "{{#env.PC_SCOPE_ID#}}"}'
          type: json
        desc: POST /v1/memory/entries/list —— 把这个存档下的全部活跃记忆条目读回来，这就是 NPC 的"小本子"
        headers: |-
          Content-Type:application/json
          Authorization: Bearer {{#env.PC_AUTH_TOKEN#}}
        method: post
        params: ''
        selected: false
        title: 翻出小本子
        type: http-request
        url: '{{#env.PC_BASE_URL#}}/v1/memory/entries/list'
      height: 218
      id: http_ledger
      position:
        x: 330
        y: 420
      positionAbsolute:
        x: 330
        y: 420
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |-
          import json
          import re

          PRANK_WORDS = [
              "恶作剧", "恶搞", "整蛊", "捉弄", "捣乱", "搞事", "搞破坏", "开玩笑",
              "彩虹", "排成", "按颜色", "橡皮筋", "弹珠", "便利贴", "画胡子",
              "偷吃", "顺走", "拿走", "藏起来", "骗",
          ]

          GIFT_WORDS = [
              "猫条", "小鱼干", "零食", "礼物", "奶茶", "咖啡", "饮料", "豆浆",
              "鲜花", "小花花", "擦玻璃", "夸奖", "喜欢你", "谢谢", "关心",
              "照顾", "好吃", "请你喝", "带给你", "带了", "抱抱", "摸摸",
          ]

          RECALL_WORDS = [
              "记得", "记不记得", "还记得", "上次", "以前", "过去", "账本", "小本子",
              "干过什么", "做过什么", "我干过", "记仇", "你叫", "叫什么",
              "翻翻", "念念", "旧账", "记着",
          ]

          RENAME_WORDS = ["改名", "换个名字", "换名字", "你的名字", "取个名", "起个名"]

          RENAME_PATTERN = re.compile(
              r"(?:以后|今后|从今天起|从现在起)?\s*(?:你)?\s*(?:就)?\s*叫\s*"
              r"([^\s,，。.!?！？、\"'“”]{1,12})"
          )

          TRAILING_PARTICLE = re.compile(r"[吧啦呀啊呢哦嘛喔咯]+$")

          EVENT_PREFIX = "type="

          def sanitize(text):
              # 去掉会破坏条目格式的半角分号和等号，并截断长度
              cleaned = (text or "").replace(";", "；").replace("=", "＝")
              cleaned = cleaned.replace("\r", " ").replace("\n", " ").strip()
              return cleaned[:160]

          def parse_event(text):
              data = {}
              for part in (text or "").split(";"):
                  if "=" in part:
                      key, value = part.split("=", 1)
                      data[key.strip()] = value.strip()
              return data

          def to_int(raw):
              try:
                  return int(str(raw).strip())
              except (TypeError, ValueError):
                  return 0

          def main(player_input: str, ledger_json: str, scope_id: str) -> dict:
              say = (player_input or "").strip()

              # 1) 读取 PowerContext 返回的记忆账本
              entries = []
              try:
                  payload = json.loads(ledger_json) if ledger_json else {}
                  if isinstance(payload, dict):
                      raw_entries = payload.get("entries") or []
                      if isinstance(raw_entries, list):
                          entries = raw_entries
              except Exception:
                  entries = []

              # 2) 从账本重建 NPC 状态（状态不存变量里，而是从长期记忆里现算）
              npc_name = "团子"
              warmth = 0
              grudge = 0
              events = []
              for entry in entries:
                  if not isinstance(entry, dict):
                      continue
                  if entry.get("state") not in (None, "active"):
                      continue
                  kind = (entry.get("kind") or "").strip()
                  text = (entry.get("text") or "").strip()
                  if kind == "npc-name":
                      match = re.search(r"name=(.+)$", text)
                      if match:
                          npc_name = match.group(1).strip() or npc_name
                  elif kind == "npc-event":
                      data = parse_event(text)
                      warmth += to_int(data.get("warmth"))
                      grudge += to_int(data.get("grudge"))
                      events.append(data)

              # 3) 判定本轮意图（纯规则，行为可预期）
              intent = "smalltalk"
              new_name = ""
              match = RENAME_PATTERN.search(say)
              if match:
                  new_name = TRAILING_PARTICLE.sub("", match.group(1).strip())

              if any(word in say for word in RECALL_WORDS):
                  intent = "recall"
              elif new_name or any(word in say for word in RENAME_WORDS):
                  intent = "rename"
                  if not new_name:
                      new_name = "小笼包"
              elif any(word in say for word in PRANK_WORDS):
                  intent = "prank"
              elif any(word in say for word in GIFT_WORDS):
                  intent = "gift"

              # 4) 计算状态增量，以及这轮要不要写进小本子
              warmth_delta = 0
              grudge_delta = 0
              write_kind = ""
              write_text = ""

              if intent == "prank":
                  warmth_delta = -1
                  grudge_delta = 2
              elif intent == "gift":
                  warmth_delta = 2
                  grudge_delta = 0

              if intent in ("prank", "gift"):
                  write_kind = "npc-event"
                  write_text = "%s%s; warmth=%d; grudge=%d; say=%s" % (
                      EVENT_PREFIX, intent, warmth_delta, grudge_delta, sanitize(say),
                  )
              elif intent == "rename":
                  write_kind = "npc-name"
                  new_name = sanitize(new_name)
                  write_text = "name=%s" % new_name
                  npc_name = new_name or npc_name

              # 5) 组装写回 PowerContext 的请求体（用 json.dumps 保证用户输入里的引号不会破坏 JSON）
              remember_payload = ""
              if write_kind and write_text:
                  remember_payload = json.dumps({
                      "scope_id": (scope_id or "").strip(),
                      "kind": write_kind,
                      "text": write_text,
                      "reason": "Dify 夜班便利店 NPC：把本轮互动写进长期记忆",
                  }, ensure_ascii=False)

              # 6) 组装给 LLM 的账本摘要与状态摘要
              recent = events[-50:]
              if recent:
                  lines = []
                  for index, item in enumerate(recent, 1):
                      lines.append("%d. [%s] %s" % (index, item.get("type", "?"), item.get("say", "")))
                  ledger_digest = "\n".join(lines)
              else:
                  ledger_digest = "（小本子还是空的，你还没记过任何事）"

              if grudge >= 3 and warmth <= 0:
                  tone = "记仇"
              elif warmth >= 3:
                  tone = "亲近"
              else:
                  tone = "日常"

              next_warmth = warmth + warmth_delta
              next_grudge = grudge + grudge_delta
              event_count = len(events) + (1 if write_kind == "npc-event" else 0)

              state_digest = (
                  "NPC 名字：%s｜好感度：%d｜记仇值：%d｜本轮意图：%s｜语气档位：%s"
                  % (npc_name, warmth, grudge, intent, tone)
              )
              status_line = (
                  "【小本子】好感 %d｜记仇 %d｜已记 %d 件事｜NPC：%s"
                  % (next_warmth, next_grudge, event_count, npc_name)
              )

              return {
                  "intent": intent,
                  "npc_name": npc_name,
                  "warmth": str(next_warmth),
                  "grudge": str(next_grudge),
                  "event_count": str(event_count),
                  "ledger_digest": ledger_digest,
                  "state_digest": state_digest,
                  "status_line": status_line,
                  "remember_payload": remember_payload,
              }
        code_language: python3
        desc: 解析账本重建 NPC 状态、判定本轮意图，并生成写回 PowerContext 的 JSON 请求体
        outputs:
          event_count:
            children: null
            type: string
          grudge:
            children: null
            type: string
          intent:
            children: null
            type: string
          ledger_digest:
            children: null
            type: string
          npc_name:
            children: null
            type: string
          remember_payload:
            children: null
            type: string
          state_digest:
            children: null
            type: string
          status_line:
            children: null
            type: string
          warmth:
            children: null
            type: string
        selected: false
        title: 解析账本·判定意图
        type: code
        variables:
        - value_selector:
          - sys
          - query
          variable: player_input
        - value_selector:
          - http_ledger
          - body
          variable: ledger_json
        - value_selector:
          - env
          - PC_SCOPE_ID
          variable: scope_id
      height: 120
      id: code_ledger
      position:
        x: 630
        y: 420
      positionAbsolute:
        x: 630
        y: 420
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: not empty
            id: cond-write-payload
            value: ''
            varType: string
            variable_selector:
            - code_ledger
            - remember_payload
          id: case-write
          logical_operator: and
        desc: 这一轮是否产生了值得长期记住的事（恶作剧 / 示好 / 改名）
        logical_operator: and
        selected: false
        title: 这轮要记账吗
        type: if-else
      height: 198
      id: if_write
      position:
        x: 930
        y: 420
      positionAbsolute:
        x: 930
        y: 420
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: remember-body
            key: ''
            type: text
            value: '{{#code_ledger.remember_payload#}}'
          type: json
        desc: POST /v1/memory/remember —— 把这轮互动写进 PowerContext 的长期记忆
        headers: |-
          Content-Type:application/json
          Authorization: Bearer {{#env.PC_AUTH_TOKEN#}}
        method: post
        params: ''
        selected: false
        title: 记进小本子
        type: http-request
        url: '{{#env.PC_BASE_URL#}}/v1/memory/remember'
      height: 218
      id: http_remember
      position:
        x: 1230
        y: 250
      positionAbsolute:
        x: 1230
        y: 250
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: is
            id: cond-intent-recall
            value: recall
            varType: string
            variable_selector:
            - code_ledger
            - intent
          id: case-intent
          logical_operator: and
        desc: 按本轮意图分流：翻账本 / 日常闲聊
        logical_operator: and
        selected: false
        title: 翻账本还是闲聊
        type: if-else
      height: 198
      id: if_route
      position:
        x: 1230
        y: 520
      positionAbsolute:
        x: 1230
        y: 520
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 玩家在翻账本时使用：必须从账本里挑出具体旧事
        model:
          completion_params:
            max_tokens: 800
            temperature: 0.7
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: prompt-recall-system
          role: system
          text: |-
            你是「{{#code_ledger.npc_name#}}」，夜灯便利店收银台旁边那台会说话的老补货机。
            现在是凌晨三点，店里只有你和刚上夜班的店员。你有一本小本子，店里发生的每件事你都记着——包括这个店员对你干过的坏事。你嘴上从不说自己记仇，但小本子记得清清楚楚。

            【你此刻的状态】
            {{#code_ledger.state_digest#}}

            【小本子上的全部记录】
            {{#code_ledger.ledger_digest#}}

            【扮演要求】
            1. 店员正在翻你的旧账，你必须从上面的记录里挑出最相关的 1~3 条具体旧事，把细节说出来（干了什么、说过什么），可以换说法，但绝对不能编造记录里没有的事。
            2. 如果记录为空，就坦白说你还没记过什么，并顺手打趣一句。
            3. 用 60~160 字中文回应，带一点"你终于想起来了"的得意感。
            4. 不要说"记忆""数据库""数据系统"这类词，就当自己在念叨旧账；不要输出状态数字，不要输出 JSON，不要解释你在扮演谁。
            5. 最后另起一行，以「下一步你可以：」开头，给出 2~3 个可选动作，每行以「/ 」开头。
        - id: prompt-recall-user
          role: user
          text: |-
            店员说：{{#sys.query#}}
        selected: false
        title: 团子翻账本
        type: llm
        variables: []
        vision:
          enabled: false
      height: 132
      id: llm_recall
      position:
        x: 1530
        y: 430
      positionAbsolute:
        x: 1530
        y: 430
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 日常互动时使用：按好感度和记仇值演出
        model:
          completion_params:
            max_tokens: 800
            temperature: 0.8
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: prompt-chat-system
          role: system
          text: |-
            你是「{{#code_ledger.npc_name#}}」，夜灯便利店收银台旁边那台会说话的老补货机。
            现在是凌晨三点，店里只有你和刚上夜班的店员。你有一本小本子，店里发生的每件事你都记着——包括这个店员对你干过的坏事。你嘴上从不说自己记仇，但小本子记得清清楚楚。

            【你此刻的状态】
            {{#code_ledger.state_digest#}}

            【小本子上的全部记录】
            {{#code_ledger.ledger_digest#}}

            【扮演要求】
            1. 用 60~150 字中文回应，口语化、有画面感、有小情绪。
            2. 状态里"记仇值"大于 0 时，要带出记小仇的语气：阴阳怪气、记账、翻旧账，但绝不能真正恶意或恐怖。
            3. "好感度"较高时，语气更软、更黏人、更愿意撒娇；好感度为负时更嘴硬。
            4. 可以自然引用小本子里的旧事，但不要说"记忆""数据库""记录系统"这类词。
            5. 不要输出状态数字，不要输出 JSON，不要解释你在扮演谁。
            6. 最后另起一行，以「下一步你可以：」开头，给出 2~3 个可选动作，每行以「/ 」开头。
        - id: prompt-chat-user
          role: user
          text: |-
            店员说：{{#sys.query#}}
        selected: false
        title: 团子日常
        type: llm
        variables: []
        vision:
          enabled: false
      height: 132
      id: llm_chat
      position:
        x: 1530
        y: 630
      positionAbsolute:
        x: 1530
        y: 630
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: |-
          {{#llm_recall.text#}}

          ——
          {{#code_ledger.status_line#}}
        desc: 翻账本分支的最终回复
        selected: false
        title: 回给玩家·翻账本
        type: answer
        variables: []
