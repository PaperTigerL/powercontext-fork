services:
  powercontext:
    image: python:3.11-slim-bookworm
    container_name: pc-server
    command:
      - sh
      - -c
      - >
        pip install --no-cache-dir -i https://pypi.tuna.tsinghua.edu.cn/simple
        "powercontext[cli,server,seekdb]==1.2.0" &&
        exec powercontext server run
    environment:
      POWERCONTEXT_HOME: /data
      POWERCONTEXT_SERVER_HTTP_HOST: 0.0.0.0
      POWERCONTEXT_SERVER_HTTP_PORT: "8000"
      POWERCONTEXT_SERVER_DATABASE_KIND: seekdb
      POWERCONTEXT_SERVER_DATABASE_PATH: /data/seekdb
      POWERCONTEXT_SERVER_ACCESS_MODE: enforced
      POWERCONTEXT_SERVER_AUTH_TOKEN: ${PC_AUTH_TOKEN:?set PC_AUTH_TOKEN}
    ports:
      - "8000:8000"
    volumes:
      - powercontext-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    restart: unless-stopped

volumes:
  powercontext-data:
